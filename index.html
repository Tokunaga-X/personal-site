<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        document.documentElement.classList.add("js");
        try {
          var lang = localStorage.getItem("portfolio_language");
          document.documentElement.lang = lang === "en" ? "en" : "zh-Hans";
          var theme = localStorage.getItem("portfolio_dark_mode");
          var dark =
            theme === "true" ||
            (theme !== "false" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.lang = "zh-Hans";
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="你好，我是徐宇超，一名开发者，目前在杭州工作 📍"
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link
      rel="preload"
      href="/fonts/newsreader-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="/hero/west-lake.avif"
      type="image/avif"
      media="(min-width: 701px)"
    />
    <link
      rel="preload"
      as="image"
      href="/hero/west-lake-mobile.avif"
      type="image/avif"
      media="(max-width: 700px)"
    />
    <title>Xu Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
